name: Integração descartável manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    if: ${{ vars.ENABLE_DISPOSABLE_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    environment: disposable-test-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Executar adaptadores de TESTE configurados explicitamente
        env:
          WP_MODERNIZER_INTEGRATION: "1"
        run: pytest -m integration -o addopts='' -vv
