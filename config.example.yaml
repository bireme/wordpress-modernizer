# Em container, use um volume persistente para permitir resume.
state_directory: ./state

allowed_app_roots:
  - /home/apps

servers:
  production-server:
    host: production.example.org
    port: 22
    environment: production
    username_secret: PROD_USERNAME
    authentication: password
    password_secret: PROD_PASSWORD
    host_key_policy: strict

databases:
  # Apenas endpoints controlados de TESTE, com schemas previamente provisionados.
  test-db:
    host: test-db.example.org
    port: 3306
    environment: test
    username_secret: TEST_DB_USERNAME
    password_secret: TEST_DB_PASSWORD

installations:
  example-site:
    source_server: production-server
    source_environment: production
    source_path: /home/apps/example.org/wp-example/htdocs
    # destination_path é um override opcional; omitido, usa source_path no servidor de TESTE.
    destination_environment: test
    allowed_database_endpoints: [test-db]
    database_aliases: []
    core_checkpoints: []

database_overrides: {}

observability:
  json_stdout: true
  log_file: null
  otel_enabled: false
